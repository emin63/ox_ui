name: Makefile CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install tkinter and Xvfb
      run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb

    - name: Install uv
      uses: astral-sh/setup-uv@v6

    - name: Install dependencies
      run: uv sync --locked

    - name: Run tests
      run: xvfb-run -a make test
